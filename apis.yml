name: Olema
description: >-
  Olema Oncology is a clinical-stage biopharmaceutical company headquartered in
  San Francisco with operations in Cambridge, Massachusetts, focused on
  developing targeted therapies for cancer. Founded in 2006, the company works
  in endocrine-driven cancers, nuclear receptors, and mechanisms of tumor drug
  resistance, with a stated goal of transforming the metastatic breast cancer
  treatment paradigm. Its investigational pipeline includes palazestrant
  (OP-1250), an oral complete estrogen receptor antagonist and selective
  estrogen receptor degrader advancing through the Phase 3 OPERA program, and
  OP-3136, a KAT6 inhibitor in Phase 1 clinical trials. Olema trades publicly on
  the Nasdaq exchange under the ticker OLMA. As a clinical-stage pharmaceutical
  company, Olema does not currently publish a developer-facing API, developer
  portal, SDKs, or public API documentation; this profile captures its corporate
  identity in the API Evangelist network.
